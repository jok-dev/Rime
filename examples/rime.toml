# rime.toml — every setting Rime reads, with its current default.
#
# Generated by `rime config-template` (rime 0.0.0). Regenerate and commit
# before each release:
#     cargo run -p rime-cli -- config-template --out examples/rime.toml
# Every line is commented out, so copying this file changes nothing;
# uncomment a line to change that setting.

# Directories (relative to this file) whose files produce no reports.
# Interfaces are still extracted from them, so cross-file checks of the
# kept files are unaffected. Default: none.
# ignore = ["Packages", "ServerPackages"]

# The Rojo project file read for cross-file checks (relative to this
# file). `--project <file>` overrides it. Default: the nearest folder at
# or above the checked path that holds a *.project.json; there,
# default.project.json wins, one file under another name is used, and
# several with no default turn cross-file checks off with a message.
# project = "default.project.json"

# [requires]
# DataModel-path patterns whose requires you vouch for when resolution
# misses: `*` matches one segment, `**` a whole subtree. Consulted only
# after a real resolution miss. Default: none.
# trust = ["game.ReplicatedStorage.Vendor.**"]

# [std]
# selene-format std-library YAML files that REPLACE the bundled
# lua51 + luau + roblox set. Default: the bundled set.
# files = ["std/roblox.yml"]
# Extra global names on top of whichever set `files` selects. Default: none.
# globals = ["it", "expect", "describe"]

# [names]
# Variable names the player-map rules (R0802, R0803) read as "this holds
# a Player" when the variable is used as a table key. A `Player`
# annotation always counts, listed or not. `*` matches any run of
# characters (`*Player`); `[]` leaves only the annotations.
# player = ["player", "plr"]

# [conservative]
# Some reports are Rime's stated limitations rather than proof of a bug
# (rendered `(conservative)`, `"conservative": true` in --format json).
# This downgrades every such report on top of its rule's level; it can
# never raise one. Default: the rule's own level.
# default = "warn"

# Custom rules from rime-rules/*.luau are keyed by their id under [rules]
# exactly like core rules, e.g. `my-rule = "off"`.

[rules]
# Values: "error" | "warn" | "off", or a table that treats the rule's
# conservative reports separately (see [conservative] above), e.g.
#     possible-nil-use = { level = "error", conservative = "off" }
# `level` defaults to the rule's default; `conservative` to [conservative]
# default, then `level`. A level can turn a rule off, lower an "error"
# rule to "warn", or raise a "warn" rule to "error" so it fails the
# run; `conservative` only lowers. Raw codes work as keys too, as in
# `R0041 = "warn"`.

# R00xx — syntax, dialect, and scope
# R0011 shadowing — a local shadows an outer binding of the same name
# shadowing = "error"
# R0012 duplicate-table-key — the same key is written twice in one table constructor
# duplicate-table-key = "error"
# R0013 unused-local — a local is declared but never read
# unused-local = "warn"
# R0014 unused-param — a parameter is never read (prefix it with `_` to keep it)
# unused-param = "warn"
# R0015 unused-function — a local function is never called
# unused-function = "warn"
# R0016 unused-assignment — a value is stored into a binding that is never read afterwards
# unused-assignment = "warn"
# R0017 faint-local — a local is built up but its final value is never used
# faint-local = "warn"
# R0021 malformed-allow — a `-- rime: allow(...)` directive Rime cannot parse (nothing is suppressed)
# malformed-allow = "warn"
# R0022 undefined-variable — a read of a name that no scope, std library, or file-level global write defines, or of `...` in a function that does not declare it
# undefined-variable = "error"
# R0023 unscoped-variable — a write to a name with no `local` in scope (an implicit global)
# unscoped-variable = "error"
# R0024 global-usage — a use of `_G` or `shared`
# global-usage = "warn"
# R0025 custom-rule-error — a rime-rules/ file failed to load, or its check threw
# custom-rule-error = "error"
# R0041 freeze-write — a write to a table that was `table.freeze`d
# freeze-write = "error"
# R0042 freeze-setmetatable — `setmetatable` on a frozen table
# freeze-setmetatable = "error"
# R0043 const-reassign — an assignment to a name declared `const`
# const-reassign = "error"
# R0044 unknown-function-attribute — a function attribute Luau does not know (`@foo function`), or one given twice
# unknown-function-attribute = "error"

# R01xx — control flow
# R0101 definite-assignment — a local may be read before it is assigned
# definite-assignment = "error"
# R0102 definite-return — a function with a non-nil return type may fall off the end
# definite-return = "error"
# R0103 unreachable-code — statements after a return, break, or throw
# unreachable-code = "warn"
# R0104 dead-store — a stored value is unconditionally overwritten before any read
# dead-store = "warn"
# R0110 pcall-discarded — the result of `pcall` is dropped, so failures go unnoticed
# Off until it is given a level, "warn" or "error": a convention a
# project chooses.
# pcall-discarded = "off"
# R0111 pairs-mutation — a table is modified while it is being iterated
# pairs-mutation = "error"

# R02xx — nil narrowing
# R0201 possible-nil-use — a value that may be nil is used where nil throws
# possible-nil-use = "error"
# R0202 use-before-guard — a value is used, then nil-checked afterwards
# use-before-guard = "error"

# R03xx — calls and module members
# R0301 call-missing-arg — a call omits a parameter whose type excludes nil
# call-missing-arg = "error"
# R0302 call-type-mismatch — a literal or annotated argument does not match the parameter type
# call-type-mismatch = "error"
# R0303 call-method-confusion — `.` used to call a method, or `:` to call a plain function
# call-method-confusion = "error"
# R0304 call-extra-args — more arguments than the callee declares
# call-extra-args = "error"
# R0305 exported-function-reassign — a module's exported function is reassigned
# Off until it is given a level, "warn" or "error": a convention a
# project chooses.
# exported-function-reassign = "off"
# R0306 unknown-member — a call to a member the module does not have: a required module's, or the file's own export
# unknown-member = "error"
# R0307 unknown-field — a read of a field the required module does not export
# unknown-field = "error"
# R0308 module-write — a write into another module's export table
# module-write = "warn"
# R0309 unused-export — an exported member no file in the project uses
# unused-export = "warn"
# R0310 module-name-mismatch — the module's export local is not named after its file
# Off until it is given a level, "warn" or "error": a convention a
# project chooses.
# module-name-mismatch = "off"
# R0312 module-scope-computation — a call or a loop at a module's top level, which runs when the module is first required
# Off until it is given a level. It takes settings of its own, as a
# table with the level beside them (each shown at its default):
#     [rules.module-scope-computation]
#     level = "error"
# The built-in lists of calls a module may make as it loads:
#   luau: the Luau library that works on the values it is given
#   (`math.*`, `string.*`, `table.*`, `bit32.*`, `utf8.*`, `buffer.*`,
#   `vector.*`) and the builtins of the same kind (`typeof`,
#   `setmetatable`, `pairs`, ...).
#   roblox-datatypes: constructors of Roblox value types (`Vector3.new`,
#   `CFrame.Angles`, `Color3.fromRGB`, ...). Not `Instance.new`, not
#   services.
# `[]` uses neither.
#     allow-builtin = ["luau", "roblox-datatypes"]
# More callees, added to the built-in lists. Written as in the source;
# `*` is any run of characters (`Signal.new`, `*.new`, `*:IsServer`).
#     allow = []
# Callees reported whatever the lists above say (`Random.new`).
#     deny = []
# `require` and `game:GetService` are allowed without being listed;
# `deny` takes them out too.
# Whether a module may loop as it loads. Calls inside are then checked.
#     allow-loops = false
# Entry scripts, left alone. The default is the names Rojo makes a
# script of; a project with `syncRules` of its own lists its own.
# An entry is a file name, or with a `/` a path below this file
# (`*` stays in one folder, `**` does not). A pattern with no `*`
# in its last part is also a folder below this file, and everything
# under it. A file that returns no value is never a module,
# whatever its name.
#     scripts = [
#         "*.server.lua", "*.server.luau",
#         "*.client.lua", "*.client.luau",
#         "*.plugin.lua", "*.plugin.luau",
#     ]
# Other files and folders the rule leaves alone. Same patterns.
#     exclude = []
# module-scope-computation = "off"

# R05xx — requires
# R0501 broken-require — a require whose target file does not exist
# broken-require = "error"
# R0502 dynamic-require — a require Rime cannot resolve statically
# dynamic-require = "error"
# R0503 require-outside-project — a require of a path outside the project's mounts
# require-outside-project = "error"
# R0506 stub-never-loaded — a `false and require(...)` stub whose real require never happens
# stub-never-loaded = "error"
# R0508 enumeration-require — `require` over a `GetChildren()`-style enumeration
# Off until it is given a level, "warn" or "error": a convention a
# project chooses.
# enumeration-require = "off"
# R0509 circular-require — modules that require each other at load time (a require cycle)
# circular-require = "error"

# R06xx — suspicious code (selene parity)
# R0601 almost-swapped — `a = b` followed by `b = a`
# almost-swapped = "error"
# R0602 divide-by-zero — division or modulo by a literal zero
# divide-by-zero = "warn"
# R0603 if-same-then-else — an `if` arm identical to its `else`
# if-same-then-else = "error"
# R0604 ifs-same-cond — an `elseif` repeating an earlier condition
# ifs-same-cond = "error"
# R0605 suspicious-reverse-loop — a numeric `for` counting the wrong way (`#t, 1` without `-1`)
# suspicious-reverse-loop = "error"
# R0606 type-check-inside-call — `type(x == "number")` — the comparison is inside the call
# type-check-inside-call = "error"
# R0607 constant-table-comparison — a comparison against a fresh table literal
# constant-table-comparison = "error"
# R0608 unbalanced-assignments — more names than values, or more values than names, in one assignment
# unbalanced-assignments = "error"
# R0609 suspicious-for-step — a numeric `for` with a step of 0, or a step that contradicts its range
# suspicious-for-step = "error"
# R0610 compare-nan — `x == 0 / 0` — NaN equals nothing, so the comparison is constant
# compare-nan = "error"
# R0611 bad-string-escape — a string escape Luau refuses (`\300`, `\xZ`), or a backslash that escapes nothing (`\d`)
# bad-string-escape = "error"

# R07xx — style (selene parity)
# R0701 empty-if — an `if` arm with no statements
# empty-if = "warn"
# R0702 empty-loop — a loop body with no statements
# empty-loop = "warn"
# R0703 mixed-table — a table constructor mixing array items and keyed fields
# Off until it is given a level, "warn" or "error": a convention a
# project chooses.
# mixed-table = "off"
# R0704 manual-table-clone — a loop that copies a table by hand instead of `table.clone`
# manual-table-clone = "warn"
# R0706 parenthesized-condition — a condition wholly inside parentheses: `if (x) then`
# parenthesized-condition = "warn"
# R0707 needless-quote-escape — a backslash before a quote that needs none: `\'` in a double-quoted string
# needless-quote-escape = "warn"
# R0708 must-use — a call to a library function that only returns a value, with the value dropped: `math.max(a, b)` on its own line
# must-use = "warn"

# R08xx — Roblox
# R0801 color3-bounds — `Color3.new` with a channel outside 0–1
# color3-bounds = "warn"
# R0802 player-map-never-cleared — a module table keyed by Player that is never cleared (it holds the Player)
# player-map-never-cleared = "warn"
# R0803 weak-player-map-never-cleared — a weak-keyed Player map that is never cleared (it holds its values)
# weak-player-map-never-cleared = "warn"
# R0804 suspicious-udim2-new — `UDim2.new` with one to three arguments (it takes four)
# suspicious-udim2-new = "warn"

# R09xx — internal
# R0900 parse-error — the file could not be parsed as Luau, or uses syntax Rime cannot check yet
# parse-error = "error"
# R0901 internal-error — Rime itself crashed on this file (a bug in Rime, not in the code)
# Always reported, whatever is set here: it also survives `ignore`,
# `--only`, and inline allows, and makes `rime check` exit 101.
# internal-error = "error"
